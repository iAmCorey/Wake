name: web-image

# 构建 Wake 网页版的多架构镜像(绿联 NAS 有 Intel 也有 ARM 机型)并推到 GHCR:
#   ghcr.io/<owner>/wake-web:latest
on:
  workflow_dispatch:
  push:
    branches: [main, feat/vault]
    paths:
      - "crates/wake-core/**"
      - "crates/wake-web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "repo=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/wake-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.name.outputs.repo }}/wake-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
