[package]
name = "wake"
version.workspace = true
edition.workspace = true
license.workspace = true

# 二进制名即 macOS 菜单栏 App 名(裸二进制无 bundle 时取进程名),须大写 Wake
[[bin]]
name = "Wake"
path = "src/main.rs"

[dependencies]
wake-core = { path = "../wake-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "fd3bc2bbb8a2c4dfe268c1475682476ada54cd0c", features = ["tree-sitter-languages"] }
futures = "0.3"
chrono.workspace = true
dirs.workspace = true
semver.workspace = true
reqwest.workspace = true
image.workspace = true
unicode-width = "0.2"
unicode-segmentation = "1.13"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
tempfile = "3"

# exe 图标 + 版本资源(build.rs 里按 CARGO_CFG_TARGET_OS 判目标生效)。
# 不做 target 门控:build-dependencies 的 [target.*] 匹配语义在 host/target
# 之间有历史歧义,门控错方向 build.rs 直接解析失败;它是纯 Rust 小依赖,
# 三平台无条件编译换四种 host×target 组合全对
[build-dependencies]
winresource = "0.1"
