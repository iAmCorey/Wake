[workspace]
resolver = "2"
members = ["crates/wake-core", "crates/wake"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
walkdir = "2"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
zstd = "0.13"
semver = "1"
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[profile.dev]
# gpui 依赖树巨大,dev 依赖开优化让 UI 不卡
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
